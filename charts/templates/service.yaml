{{- if and .Values.enabled .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "deploy.qualifier" . }}
  labels:
    {{- include "deploy.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- range .Values.ports }}
    - name: {{ .name }}
      port: {{ .source }}
      targetPort: {{ .target }}
      protocol: {{ .protocol }}
    {{- end }}
  selector:
    {{- include "deploy.selectorLabels" . | nindent 4 }}
{{- end }}